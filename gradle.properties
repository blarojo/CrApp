org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Good DevEx / snappy Gradle iteration (docs/backlog.md's DevEx principle):
# - org.gradle.caching reuses task outputs across clean builds/branch switches
#   instead of recompiling everything every time.
# - org.gradle.configuration-cache skips re-evaluating the build scripts entirely on
#   a repeat build with no relevant changes (measured: a no-op `testDebugUnitTest
#   :wear:assembleDebug` build dropped from ~65s to ~1s on this project with it on).
#   Verified compatible with this project's build (AGP 8.7.2, KSP/Room, Jacoco, the
#   :wear module) as of Gradle 8.9 -- re-check for "problems" warnings after any
#   AGP/Gradle upgrade, since configuration-cache support varies by plugin version.
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.incremental=true
